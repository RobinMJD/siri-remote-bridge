name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install ruff==0.15.9
      - run: ruff check . && ruff format --check .
      - run: python -m compileall -q .
      - run: sh -n bluez-entrypoint.sh
      - run: docker compose config -q
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build bluez relay
      - run: sh tests/smoke-container.sh
      - name: Check receiver D-Bus permissions
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --cap-add SETUID --cap-add SETGID --tmpfs /run/siri-test:mode=0755
          --entrypoint /bin/sh -v "$PWD/tests/smoke-dbus.sh:/smoke-dbus.sh:ro"
          local/siri-remote-bridge-bluez:0.1.0 /smoke-dbus.sh
      - name: Test deployed Linux image without a radio
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:mode=1777
          --entrypoint python3 -e PYTHONPATH=/workspace -v "$PWD:/workspace:ro"
          -w /opt/siri-remote local/siri-remote-bridge-relay:0.1.0
          -B -m unittest discover -s /workspace/tests -v
