name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install ruff==0.15.9
      - run: ruff check . && ruff format --check .
      - run: python -m compileall -q .
      - run: sh -n bluez-entrypoint.sh
      - run: docker compose config -q
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose build bluez relay
      - run: sh tests/smoke-container.sh
      - name: Test deployed Linux image without a radio
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --entrypoint python3 -v "$PWD:/workspace:ro"
          -w /opt/siri-remote local/siri-remote-bridge-relay:0.1.0
          -B -m unittest discover -s /workspace/tests -v
