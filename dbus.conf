<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/siri-test/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="root"/>
    <allow user="receiver"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <allow receive_sender="*"/>
    <allow send_destination="org.freedesktop.DBus"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
  </policy>
  <policy user="receiver">
    <allow send_destination="org.bluez"/>
    <deny send_destination="org.bluez" send_interface="org.bluez.Device1" send_member="Pair"/>
    <deny send_destination="org.bluez" send_interface="org.bluez.Adapter1" send_member="RemoveDevice"/>
  </policy>
</busconfig>
