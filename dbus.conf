<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/siri-test/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="root"/>
    <allow user="receiver"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <allow receive_sender="*"/>
    <allow send_destination="org.freedesktop.DBus"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
  </policy>
  <policy user="receiver">
    <!-- Status probe, bonded reconnect and the pinned HID decoder. -->
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.Device1" send_member="Connect"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.Device1" send_member="Disconnect"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.GattCharacteristic1" send_member="ReadValue"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.GattCharacteristic1" send_member="WriteValue"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.GattCharacteristic1" send_member="StartNotify"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.GattCharacteristic1" send_member="StopNotify"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.GattDescriptor1" send_member="ReadValue"/>
    <!-- The decoder's bonded reconnect fallback registers a temporary agent. -->
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.AgentManager1" send_member="RegisterAgent"/>
    <allow send_destination="org.bluez" send_type="method_call" send_interface="org.bluez.AgentManager1" send_member="UnregisterAgent"/>
  </policy>
</busconfig>
